[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente10k"
version = "0.1.0"
description = "Agente investigador sobre informes 10-K de la SEC (práctica MIAX)"
requires-python = ">=3.12"
dependencies = []   # las dependencias se instalan con requirements.txt (versiones fijadas del curso)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
